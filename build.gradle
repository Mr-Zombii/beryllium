plugins {
    id 'java'
    id 'jigsaw-cosmic-reach'
}

group = p_group
version = p_version

jigsawGame {
    splitSourceSets()
}

jigsawAccess {
    addManipulators(file("$projectDir/src/common/resources/${p_id}.manipulator"))
}

//jigsawInject {
//    setModJson(file("$projectDir/src/common/resources/puzzle.mod.json"))
//}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    puzzleLoader "dev.puzzleshq:puzzle-loader-core:$puzzle_loader_core_version"
    puzzleLoader "dev.puzzleshq:puzzle-loader-cosmic:$puzzle_loader_cosmic_version"

    cosmicReach("finalforeach:cosmic-reach:${cosmic_reach_version}")

    commonBundle clientImplementation ("it.unimi.dsi:fastutil:$fastutil_version")
}

processCommonResources {
    def projectProperties = [
            "p_name": p_name,
            "p_version": ((String)version).contains(".") ? version : "0.0.0",
            "p_desc": p_desc,

            "p_id": p_id,
            "p_group": p_group,
            "p_author": p_author
    ]

    inputs.properties projectProperties

    filesMatching(["puzzle.mod.json"]) {
        expand projectProperties
    }
}

processClientResources {
    // projectFolder/assets
    def resourcesFolder = new File("${sourceSets.client.output.resourcesDir}/")
    def modelsFolder = new File("${sourceSets.client.output.resourcesDir}/assets/$p_id/models/")
    // projectFolder/assets/assets.txt
    def assetsFile = new File("${sourceSets.client.output.resourcesDir}/", "$p_id-assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(modelsFolder).collect { resourcesFolder.relativePath(it) }.each {
        assetsFile.append(it + "\n")
    }
}

tasks.register("runWithRenderDoc") {
    group = "beryllium"
    description = "Launches runModdedClient wrapped in RenderDoc"

    dependsOn("classes")

    doLast {
        def renderdocPath = (findProperty("renderdocPath")
                ?: "C:/Program Files/RenderDoc/renderdoccmd.exe") as String

        if (!file(renderdocPath).exists()) {
            throw new GradleException("RenderDoc not found at: $renderdocPath")
        }

        def clientTask = tasks.named("runModdedClient").get() as JavaExec
        def captureDir = file("$projectDir/renderdoc_captures")
        captureDir.mkdirs()

        def javaHome = org.gradle.internal.jvm.Jvm.current().getJavaHome()
        def javaPath = new File(javaHome, "bin/java").absolutePath

        def cmd = new ArrayList<String>()
        cmd.add(renderdocPath)
        cmd.add("capture")
        cmd.add("--opt-hook-children")
        cmd.add("--wait-for-exit")
        cmd.add(javaPath)
        for (def arg : clientTask.allJvmArgs) { cmd.add(arg as String) }
        cmd.add("-cp")
        cmd.add(clientTask.classpath.asPath as String)
        cmd.add(clientTask.mainClass.get() as String)
        if (clientTask.args) {
            for (def arg : clientTask.args) { cmd.add(arg as String) }
        }

        println "Running: ${cmd.join(' ')}"

        new ProcessBuilder(cmd)
                .directory(clientTask.workingDir)
                .inheritIO()
                .start()
                .waitFor()
    }
}
wrapper {
    gradleVersion = "8.14"
    distributionType = Wrapper.DistributionType.ALL
}
